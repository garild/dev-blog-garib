
name: Build and Deploy Statiq Blog

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and Validate Website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        working-directory: src
        run: dotnet restore

      - name: Clean previous output
        shell: bash
        run: |
          rm -rf src/output

      - name: Generate Statiq website
        working-directory: src
        run: dotnet run --configuration Release --no-restore

      - name: List generated HTML files
        shell: bash
        run: |
          echo "Generated pages:"
          find src/output -type f -name "*.html" | sort

      - name: Validate required pages and assets
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "src/output/index.html"
            "src/output/about/index.html"
            "src/output/blog/index.html"
            "src/output/projects/index.html"
            "src/output/assets/css/site.css"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "::error::Missing required file: $file"
              exit 1
            fi

            echo "OK: $file"
          done

      - name: Validate every Markdown article
        shell: bash
        run: |
          set -euo pipefail

          count=0

          while IFS= read -r -d '' article; do
            filename=$(basename "$article" .md)

            expected="src/output/posts/$filename/index.html"

            echo "Checking: $article"

            if [ ! -f "$expected" ]; then
              echo "::error::Missing generated article: $expected"
              exit 1
            fi

            echo "OK: $expected"
            count=$((count + 1))

          done < <(find src/input/posts -type f -name "*.md" -print0)

          if [ "$count" -eq 0 ]; then
            echo "::error::No Markdown articles found"
            exit 1
          fi

          echo "Validated $count articles successfully"

      - name: Create Pages summary
        shell: bash
        run: |
          {
            echo "## Statiq Web Build"
            echo ""
            echo "### Generated HTML pages"
            echo ""
            find src/output -type f -name "*.html" \
              | sort \
              | sed 's|src/output/|- |'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Disable Jekyll
        run: touch src/output/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload generated website
        uses: actions/upload-pages-artifact@v4
        with:
          path: src/output

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
