
name: Build and Deploy Statiq Blog

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and Validate Website
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install .NET 10
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # 3. Restore dependencies
      - name: Restore dependencies
        working-directory: src
        run: dotnet restore

      # 4. Remove old generated output
      - name: Clean previous output
        shell: bash
        run: |
          rm -rf src/output

      # 5. Generate website
      - name: Generate Statiq website
        working-directory: src
        run: dotnet run --configuration Release --no-restore

      # 6. Display generated HTML files
      - name: Discover generated pages
        shell: bash
        run: |
          set -euo pipefail

          echo "=================================="
          echo " STATIQ GENERATED HTML FILES"
          echo "=================================="

          if [[ ! -d src/output ]]; then
            echo "::error::Statiq output directory missing"
            exit 1
          fi

          find src/output -type f -name '*.html' | sort

          PAGE_COUNT=$(
            find src/output -type f -name '*.html' | wc -l
          )

          echo ""
          echo "Total HTML pages: $PAGE_COUNT"

          if [[ "$PAGE_COUNT" -lt 2 ]]; then
            echo "::error::Expected at least 2 HTML pages"
            exit 1
          fi

      # 7. Validate required pages
      - name: Validate essential pages and assets
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "src/output/index.html"
            "src/output/about/index.html"
            "src/output/blog/index.html"
            "src/output/projects/index.html"
            "src/output/assets/css/site.css"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error::Missing required file: $file"
              exit 1
            fi

            echo "OK: $file"
          done

          echo "All required pages and assets exist"

      # 8. Validate ALL Markdown articles
      - name: Validate every Markdown article
        shell: bash
        run: |
          set -euo pipefail

          count=0
          errors=0

          while IFS= read -r -d '' article; do

            # Path relative to posts folder
            relative="${article#src/input/posts/}"

            # Remove extension
            relative="${relative%.md}"

            # Support:
            # posts/article.md
            # posts/article/index.md
            if [[ "$relative" == */index ]]; then
              slug="${relative%/index}"
            else
              slug="$relative"
            fi

            expected="src/output/posts/$slug/index.html"

            echo ""
            echo "Checking article: $article"
            echo "Expected output: $expected"

            if [[ -f "$expected" ]]; then
              echo "OK: $expected"
            else
              echo "::error::Missing generated article: $expected"
              errors=$((errors + 1))
            fi

            count=$((count + 1))

          done < <(
            find src/input/posts \
              -type f \
              -name '*.md' \
              -print0
          )

          echo ""
          echo "Total articles: $count"
          echo "Missing articles: $errors"

          if [[ "$count" -eq 0 ]]; then
            echo "::error::No Markdown articles found"
            exit 1
          fi

          if [[ "$errors" -gt 0 ]]; then
            echo ""
            echo "Actual generated article HTML files:"

            find src/output/posts \
              -type f \
              -name '*.html' \
              | sort || true

            exit 1
          fi

          echo "All article checks passed"

      # 9. Generate build summary
      - name: Generate build summary
        shell: bash
        run: |
          {
            echo "## Statiq Blog Build Report"
            echo ""
            echo "### Generated HTML pages"
            echo ""

            find src/output \
              -type f \
              -name '*.html' \
              | sort \
              | sed 's|src/output/|- |'
          } >> "$GITHUB_STEP_SUMMARY"

      # 10. Disable Jekyll
      - name: Disable Jekyll
        run: touch src/output/.nojekyll

      # 11. Configure GitHub Pages
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # 12. Upload Statiq output
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: src/output

  deploy:
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # 13. Deploy
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
