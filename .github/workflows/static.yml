
name: Build and Deploy Statiq Blog

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Find Statiq project
        id: project
        shell: bash
        run: |
          mapfile -t projects < <(
            find src -name '*.csproj' -not -path '*/obj/*'
          )

          if [ "${#projects[@]}" -ne 1 ]; then
            echo "Expected one project under src."
            printf '%s\n' "${projects[@]}"
            exit 1
          fi

          project_dir=$(dirname "${projects[0]}")
          echo "dir=$project_dir" >> "$GITHUB_OUTPUT"

      - name: Restore dependencies
        run: dotnet restore
        working-directory: ${{ steps.project.outputs.dir }}

      - name: Generate Statiq website
        run: dotnet run -c Release --no-restore
        working-directory: ${{ steps.project.outputs.dir }}

      - name: Validate generated HTML
        shell: bash
        run: |
          site_dir="${{ steps.project.outputs.dir }}/output"

          if [ ! -f "$site_dir/index.html" ]; then
            echo "ERROR: Missing $site_dir/index.html"
            exit 1
          fi

          touch "$site_dir/.nojekyll"
          echo "site_dir=$site_dir" >> "$GITHUB_OUTPUT"
        id: site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload generated website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ steps.site.outputs.site_dir }}

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
