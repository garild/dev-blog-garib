<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Transactional Outbox: interactive walkthrough</title>
<style>
:root{color-scheme:light;font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;background:#f7f9ff;color:#121b39}*{box-sizing:border-box}body{margin:0;padding:18px}.demo{max-width:900px;margin:auto;border:1px solid #d9e1fa;border-radius:18px;background:#fff;padding:22px;box-shadow:0 12px 34px #263c7310}header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}h1{font-size:22px;letter-spacing:-.04em;margin:0}.tag{font-size:12px;border:1px solid #d7ddf7;background:#f4f2ff;color:#5635be;border-radius:99px;padding:5px 10px}.steps{display:flex;gap:6px;margin:20px 0}.steps span{height:7px;flex:1;border-radius:20px;background:#e6e9f6}.steps span.on{background:#6949d9}.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:24px 0}.node{border:1px solid #d6def4;border-radius:12px;text-align:center;padding:16px 7px;min-height:105px;background:#fbfcff}.node b{display:block;font-size:14px}.node small{display:block;color:#67738a;margin-top:10px}.node.active{background:#f0ecff;border-color:#6949d9;box-shadow:0 0 0 2px #6949d91f}.node.good{background:#e9fff5;border-color:#21a875}.node.bad{background:#fff0f1;border-color:#e35465}.detail{background:#f4f7ff;border:1px solid #e2e8ff;border-radius:12px;padding:14px 16px;min-height:100px}h2{font-size:17px;margin:0 0 7px}p{margin:0}nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px}button{cursor:pointer;background:#6443d6;color:#fff;border:0;border-radius:9px;padding:12px 17px;font:600 14px system-ui}button.secondary{background:#eae7f7;color:#342d66}button:disabled{opacity:.4;cursor:default}.foot{color:#667086;font-size:12px;margin-top:12px}@media(max-width:540px){body{padding:6px}.demo{padding:14px}.flow{grid-template-columns:repeat(2,1fr)}h1{font-size:19px}}
</style></head><body><main class="demo"><header><h1>What happens when the broker fails?</h1><span class="tag">Outbox walkthrough</span></header><div class="steps" id="progress" aria-label="Step progress"></div><section class="flow" id="flow" aria-label="System components"></section><section class="detail" aria-live="polite"><h2 id="heading"></h2><p id="description"></p></section><nav><button class="secondary" id="prev">← Previous</button><button id="next">Next step →</button></nav><p class="foot">Illustrative workflow. A real publisher must use durable claiming, broker acknowledgment and idempotent consumers.</p></main>
<script>
const states=[
{title:'1. Customer completes payment',desc:'The Payment Service receives a payment command.',active:0},
{title:'2. One atomic database commit',desc:'The Payment row and the OutboxMessage row are persisted in the same PostgreSQL transaction. Neither can commit independently.',active:1,good:[1]},
{title:'3. Message broker is unavailable',desc:'Publishing fails, but the event is durable in the Outbox table. No payment data is lost.',active:2,bad:[2],good:[1]},
{title:'4. Worker retries safely',desc:'After backoff, an outbox worker claims the row and publishes the event. The row is marked published only after broker acknowledgement.',active:2,good:[1,2]},
{title:'5. Consumer handles the event',desc:'The Subscription Service activates access and records the MessageId atomically. A duplicate delivery is ignored.',active:3,good:[1,2,3]}
];
const nodes=[['Client','Payment request'],['PostgreSQL','Payment + Outbox'],['Publisher → Broker','Retry & ACK'],['Subscription','Inbox check']];let index=0;
function render(){const s=states[index];document.querySelector('#progress').innerHTML=states.map((_,i)=>`<span class="${i<=index?'on':''}"></span>`).join('');document.querySelector('#flow').innerHTML=nodes.map((n,i)=>`<div class="node ${s.active===i?'active':s.bad?.includes(i)?'bad':s.good?.includes(i)?'good':''}"><b>${n[0]}</b><small>${n[1]}</small></div>`).join('');document.querySelector('#heading').textContent=s.title;document.querySelector('#description').textContent=s.desc;document.querySelector('#prev').disabled=index===0;document.querySelector('#next').textContent=index===states.length-1?'Replay ↻':'Next step →';}
document.querySelector('#prev').addEventListener('click',()=>{index=Math.max(0,index-1);render()});document.querySelector('#next').addEventListener('click',()=>{index=(index+1)%states.length;render()});render();
</script></body></html>
